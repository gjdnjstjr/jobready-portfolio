<style>
body{margin:0;background:#F4F5F2}
a{color:#2443C4;text-decoration:none}a:hover{color:#16308F}
.gnb a.m{color:#4A4F57;padding:10px 14px;border-radius:8px;font-weight:500}
.gnb a.m:hover{background:#ECEDE8;color:#15171A}
.gnb a.on{color:#15171A;font-weight:700;background:#ECEDE8}
.nv button{height:60px;padding:0 2px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:15px;font-weight:500;color:#4A4F57;cursor:pointer;white-space:nowrap}
.nv button:hover{color:#15171A}
.nv button.on{color:#2443C4;font-weight:700;border-bottom-color:#2443C4}
.hb{height:40px;padding:0 16px;border:1px solid #D9DBD3;border-radius:9px;background:#FFFFFF;color:#15171A;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hb:hover{border-color:#15171A;color:#15171A}
.hb.p{background:#2443C4;border-color:#2443C4;color:#FFFFFF}.hb.p:hover{background:#1B37A8;color:#FFFFFF}
.sec{max-width:1200px;margin:0 auto;padding:96px 40px 24px;box-sizing:border-box;scroll-margin-top:64px}
.sh{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin-bottom:48px}
.sh h2{margin:0;font-size:40px;font-weight:300;letter-spacing:-1px}
.sh i{display:block;width:120px;height:2px;background:linear-gradient(90deg,#D9DBD3 0 30%,#2443C4 30% 70%,#D9DBD3 70%)}
.sh p{margin:0;font-size:15.5px;color:#4A4F57}
.card{background:#FFFFFF;border:1px solid #E1E3DC;border-radius:16px}
.mono{font-family:'JetBrains Mono',monospace}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 28px;border-left:1px solid #E1E3DC}
.stat:first-child{border-left:0;padding-left:0}
.stat b{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;color:#2443C4}
.stat span{font-size:14px;color:#4A4F57}
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:14px 18px;background:#FFFFFF;border:1px solid #E1E3DC;border-radius:12px;box-shadow:0 12px 30px rgba(21,23,26,.10);font-size:14.5px;font-weight:600;white-space:nowrap}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid #EEEFEA}
.trow b{font-weight:500;font-size:16px}
.trow span{text-align:right;font-size:14px;font-weight:600;color:#2443C4}
.tech{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border:1px solid #E1E3DC;border-radius:10px;background:#FFFFFF;font-size:14.5px;font-weight:500}
.tech i{width:10px;height:10px;border-radius:99px;flex:none}
.aw{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid #EEEFEA;font-size:14.5px}
.tl{position:relative;padding-left:28px;display:flex;flex-direction:column;gap:16px}
.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:#D9DBD3}
.tli{position:relative}
.tli:before{content:"";position:absolute;left:-26px;top:22px;width:12px;height:12px;border-radius:99px;background:#FFFFFF;border:3px solid #2443C4;box-sizing:border-box}
.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:#3D424A}
.bl li:before{content:"- ";color:#2443C4}
.ft{height:40px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:16px;color:#6B7079;cursor:pointer}
.ft.on{color:#15171A;font-weight:600;border-bottom-color:#2443C4}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;width:100%}
.deft{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:28px}
.btn{height:50px;padding:0 28px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box}
.btn.p{background:#2443C4;color:#FFFFFF}.btn.p:hover{background:#1B37A8;color:#FFFFFF}
.btn.o{border:1px solid #D9DBD3;background:#FFFFFF;color:#15171A}.btn.o:hover{border-color:#15171A;color:#15171A}
.sum{min-width:0}
.sum li{white-space:normal;overflow:visible;line-height:1.6;word-break:break-word}
.ts{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid #EEEFEA;font-size:15px}
.ts b{color:#2443C4;font-size:14px}
.cb{height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-sizing:border-box}
.sub a{height:52px;display:inline-flex;align-items:center;border-bottom:2px solid transparent;color:#4A4F57;font-size:15px;font-weight:500;box-sizing:border-box}
.sub a:hover{color:#15171A}
.sub a.on{color:#15171A;font-weight:700;border-bottom-color:#15171A}
.hb.g{border-color:#B9C3EC;color:#1E3AA8}
</style>
