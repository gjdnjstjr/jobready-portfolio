<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자 포트폴리오</title>
<!-- 글꼴 Pretendard 1.3.9 (프론트와 같음) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 색 · 글자 · 간격은 JOBReady 프론트(원티드 몽타주 + 합격 그린, PRD 10.2)와 같은 값 -->
<style>
:root{
  --ink-body:oklch(0.259 0.01 273);--ink-label:oklch(0.298 0.01 273);--line:oklch(0.521 0.018 273);
  --background:oklch(0.972 0.002 286);--card:oklch(1 0 0);
  --foreground:color-mix(in oklab,var(--ink-body) 88%,white);
  --foreground-strong:oklch(0.148 0.004 277);
  --muted-foreground:color-mix(in oklab,var(--ink-label) 61%,white);
  --foreground-subtle:color-mix(in oklab,var(--ink-label) 43%,white);
  --foreground-disabled:color-mix(in oklab,var(--ink-label) 28%,white);
  --muted:oklch(0.961 0.002 286);
  --fill:color-mix(in oklab,var(--line) 10%,transparent);
  --border:color-mix(in oklab,var(--line) 8%,transparent);
  --border-outline:color-mix(in oklab,var(--line) 16%,transparent);
  --border-strong:color-mix(in oklab,var(--line) 35%,transparent);
  /* 합격 그린 (PRD 10.2) */
  --primary:oklch(0.47 0.1 163);--primary-foreground:oklch(1 0 0);
  --highlight:oklch(0.955 0.035 163);--highlight-foreground:oklch(0.4 0.09 163);
  --highlight-weak:oklch(0.985 0.012 163);
  --interaction-hover:oklch(0.205 0.004 286 / 0.075);--interaction-active:oklch(0.205 0.004 286 / 0.18);
  --overlay:oklch(0 0 0);
  --shadow-raise:0 1px 2px oklch(0.155 0 0 / 0.06),0 1px 3px oklch(0 0 0 / 0.05);
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:16px;line-height:1.5;letter-spacing:.0057em;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{display:block}
button{font:inherit;letter-spacing:inherit}
/* 몽타주 타입 스케일 (프론트 app.css @theme) */
.t-caption1{font-size:12px;line-height:1.334;letter-spacing:.0252em}
.t-label2{font-size:13px;line-height:1.385;letter-spacing:.0194em}
.t-label1{font-size:14px;line-height:1.429;letter-spacing:.0145em}
.t-body2{font-size:15px;line-height:1.467;letter-spacing:.0096em}
.t-headline1{font-size:18px;line-height:1.445;letter-spacing:-.002em}
.t-heading2{font-size:20px;line-height:1.4;letter-spacing:-.012em}
.t-title3{font-size:24px;line-height:1.334;letter-spacing:-.023em}
.c-strong{color:var(--foreground-strong)}.c-muted{color:var(--muted-foreground)}.c-subtle{color:var(--foreground-subtle)}
.c-primary{color:var(--primary)}
.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.pre{white-space:pre-line}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 96px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
/* 섹션 머리: 제목 + 헤어라인, 선 앞쪽에 primary 짧은 선 (프론트 SectionHead · TemplateSection) */
.sh{display:flex;align-items:center;gap:16px}
.sh h2{flex:none;font-weight:700;color:var(--foreground-strong)}
.sh i{position:relative;flex:1;height:1px;background:var(--border)}
.sh i::before{content:"";position:absolute;left:0;top:-1px;height:2px;border-radius:999px;background:var(--primary)}
/* 몽타주 button: 굵기 700, solid는 hover 때 인터랙션 층 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;height:40px;padding:0 20px;border:1px solid transparent;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.006em;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--primary);color:var(--primary-foreground)}
.btn-p:hover{background-image:linear-gradient(var(--interaction-hover),var(--interaction-hover))}
.btn-p:active{background-image:linear-gradient(var(--interaction-active),var(--interaction-active))}
.btn-o{border-color:var(--border-outline);background:var(--card);color:var(--foreground)}
.btn-o:hover{background:var(--muted)}
.btn-sm{height:32px;padding:0 14px;border-radius:8px;font-size:14px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{height:44px}
.btn:disabled{cursor:default;background:var(--fill);color:var(--foreground-disabled);background-image:none}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 30%,transparent)}
/* 몽타주 chip brand 34px */
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--highlight);color:var(--highlight-foreground);font-size:13px;font-weight:600;letter-spacing:.0194em}
/* 확대 보기 */
.zoom{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:32px;background:color-mix(in oklch,var(--overlay) 86%,transparent);cursor:zoom-out}
.zoom img{max-width:min(1100px,100%);max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:12px}
.zoom button{position:absolute;top:20px;right:20px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:999px;background:color-mix(in oklch,white 10%,transparent);color:#fff;cursor:pointer}
.zoom button:hover{background:color-mix(in oklch,white 20%,transparent)}
.zoom button svg{width:20px;height:20px}

/* 섹션 메뉴: 위에 붙는 흰 바 + 고른 메뉴 = chip brand (프론트 SectionNav) */
.nav{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--card) 95%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;gap:4px;overflow-x:auto}
.nav button{flex:none;height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted-foreground);font-size:13px;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s}
.nav button:hover{background:var(--muted);color:var(--foreground)}
.nav button.on{background:var(--highlight);color:var(--highlight-foreground);font-weight:600}
.article{display:flex;flex-direction:column;gap:96px}
.sec{display:flex;flex-direction:column;gap:32px;scroll-margin-top:80px}
.head{display:flex;flex-direction:column;gap:8px}
.sh h2{font-size:24px;line-height:1.334;letter-spacing:-.023em}
.sh i::before{width:48px}
/* 홈 */
.home{display:grid;grid-template-columns:minmax(0,1fr) 280px;align-items:center;gap:48px}
.home-l{display:flex;flex-direction:column;gap:24px}
.home h1{display:flex;flex-direction:column;gap:4px;font-size:36px;line-height:1.25;font-weight:700;color:var(--foreground-strong);letter-spacing:-.025em}
.home .lead{display:flex;flex-direction:column;gap:4px;font-size:18px;line-height:1.625}
.stats{display:flex;gap:40px}
.stats div{display:flex;flex-direction:column-reverse;gap:4px}
.stats dd{font-size:30px;line-height:1.2;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.home-r{display:flex;flex-direction:column;align-items:center;gap:16px}
.avatar{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:256px;aspect-ratio:1;overflow:hidden;border-radius:999px;background:var(--highlight);color:var(--highlight-foreground);font-size:60px;font-weight:700}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;text-align:center}
.who span{display:flex;align-items:center;justify-content:center;gap:6px}
.who svg{width:16px;height:16px;flex:none;color:var(--primary)}
.who i{width:8px;height:8px;flex:none;border-radius:999px;background:var(--primary)}
/* 소개 */
.about{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
.col{display:flex;flex-direction:column}
.group{display:flex;flex-direction:column;gap:12px}
.rows li{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border)}
.techs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.techs li{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.techs i{width:8px;height:8px;flex:none;border-radius:999px;background:var(--primary)}
.awards li{display:flex;align-items:center;gap:12px}
.awards .date{width:96px;flex:none}
/* 이력 및 활동 */
.history{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px}
.tl{margin-left:6px;border-left:1px solid var(--border)}
.tl>li{position:relative;display:flex;flex-direction:column;gap:4px;padding:0 0 24px 24px}
.tl>li::before{content:"";position:absolute;top:4px;left:-6px;width:12px;height:12px;border:3px solid var(--primary);border-radius:999px;background:var(--card)}
.bul{margin-top:4px;padding-left:20px;list-style:disc;display:flex;flex-direction:column;gap:4px}
.bul li::marker{color:var(--primary)}
.edu{display:flex;flex-direction:column;gap:8px;padding:20px;border-top:3px solid var(--primary);border-radius:12px}
.certs li{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--border)}
.certs svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--primary)}
/* 프로젝트 */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--muted-foreground);font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s}
.filters button:hover{border-color:var(--border-strong);color:var(--foreground)}
.filters button.on{border-color:transparent;background:var(--highlight);color:var(--highlight-foreground);font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.pcard{display:flex;flex-direction:column;overflow:hidden}
.cover{position:relative;aspect-ratio:16/9}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 자동 썸네일: 레포명(모노) + 주 언어, 연한 브랜드 바탕 (프론트 AutoThumbnail) */
.auto{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:24px;background:var(--highlight-weak)}
.auto .repo{font-size:24px;font-weight:600}
.auto .lang{display:flex;align-items:center;gap:8px}
.auto i{width:10px;height:10px;border-radius:999px;background:var(--primary)}
.pbody{display:flex;flex:1;flex-direction:column;gap:12px;padding:24px}
.prow{display:flex;justify-content:space-between;gap:12px}
.sum{display:flex;flex-direction:column;gap:4px;height:96px;overflow:hidden}
.sum li{display:flex;gap:8px;min-width:0}
.sum li b{flex:none;font-weight:400;color:var(--primary)}
.pbtn{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.pbtn .btn{flex:1}
/* 트러블슈팅 */
.tcard{display:flex;flex-direction:column;gap:12px;padding:24px}
.tag{padding:2px 8px;border-radius:6px;background:var(--highlight);color:var(--highlight-foreground)}
.tdl{display:flex;flex-direction:column;gap:8px}
.tdl div{display:grid;grid-template-columns:3rem minmax(0,1fr);align-items:start;gap:8px}
.tdl dt{font-weight:700;color:var(--primary)}
.empty-box{padding:40px;border:1px dashed var(--border-strong);border-radius:12px;background:var(--card);text-align:center}
/* 연락처 */
.contact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.links li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.links .k{width:112px;flex:none}
.mail{display:flex;flex-direction:column;gap:16px;padding:24px;border-top:3px solid var(--primary)}
.mail .acts{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:96px;padding-top:24px;border-top:1px solid var(--border);text-align:center}
@media (max-width:860px){
  .wrap{padding:24px 16px 64px}
  .home,.about,.history,.contact,.g2{grid-template-columns:minmax(0,1fr)}
  .home-r{order:-1}.avatar{max-width:180px}
  .home h1{font-size:28px}
  .rows li{grid-template-columns:minmax(0,1fr);gap:4px}
  .article{gap:72px}
}
</style>
<script src="./_runtime/preact.min.js"></script>
<script src="./_runtime/dc-lite.js"></script>
</head>

<script>

class Component extends DCLogic {
  constructor(p){ super(p); this.state = { filter: null, copied: false, tab: "home", failed: {} }; this._spy = this._spy.bind(this); }
  componentDidMount() { try { window.addEventListener("scroll", this._spy, { passive: true }); this._spy(); } catch (e) {} }
  _ids() { return SECTIONS.map((s) => s[0]).filter((id) => document.getElementById(id)); }
  _spy() {
    if (this._lock) return;
    const ids = this._ids();
    let cur = ids[0] || "home";
    for (const id of ids) { const el = document.getElementById(id); if (el.getBoundingClientRect().top <= SPY_OFFSET) cur = id; }
    const de = document.documentElement;
    if (window.innerHeight + window.scrollY >= de.scrollHeight - 4) cur = ids[ids.length - 1] || cur;
    if (cur !== this.state.tab) this.setState({ tab: cur });
  }
  _go(id) {
    const el = document.getElementById(id); if (!el) return;
    this._lock = true; clearTimeout(this._lt); this._lt = setTimeout(() => { this._lock = false; this._spy(); }, 700);
    this.setState({ tab: id });
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  renderVals() {
    const page = (window.__PAGE_DATA && window.__PAGE_DATA.home) ? window.__PAGE_DATA : SAMPLE_PORTFOLIO;
    const s = this.state;
    const text = (v) => (typeof v === "string" ? v : (v == null ? "" : String(v)));

    const isHttp = (v) => /^https?:\/\//i.test(text(v));
    const imageAddress = (v) => { const t = text(v); return /^(https?:|data:image\/)/i.test(t) || t.indexOf("images/") >= 0 ? t : ""; };

    const home = page.home || {}, about = page.about || {}, history = page.history || {}, contact = page.contact || {};
    const edu = history.education || {};
    const headline = pair(home.headline), summary = pair(home.summary);

    const photoSrc = imageAddress(home.photo) || imageAddress(((home.photos || [])[0] || {}).file);
    const cards = page.projects || [];
    const techs = cards.map((c) => text(c.main_tech)).filter((t, i, all) => t && all.indexOf(t) === i);
    const filter = techs.indexOf(s.filter) >= 0 ? s.filter : null;

    return {
      tabs: SECTIONS.filter((x) => x[0] !== "projects" || hasProjects).map((x) => ({
        label: x[1], cls: s.tab === x[0] ? "on" : "", cur: s.tab === x[0] ? "true" : null, pick: () => this._go(x[0])
      })),
      headline0: headline[0], headline1: headline[1], summary0: summary[0], summary1: summary[1],
      stats: (home.stats || []).map((x) => ({ label: text(x.label), value: text(x.value) })),
      photoSrc: photoSrc, hasPhoto: !!photoSrc, showPhotoText: !photoSrc, photoText: text(home.photo_text),
      location: text(home.location), hasLocation: !!text(home.location).trim(),
      position: text(home.position), hasPosition: !!text(home.position).trim(),
      aboutTitle: text(about.title) || "사용 기술 및 경험",
      aboutDescription: text(about.description), hasAboutDescription: !!text(about.description),
      groups: (about.groups || []).map((g) => ({
        name: text(g.name), description: text(g.description), hasDescription: !!text(g.description),
        rows: (g.rows || []).map((r) => ({ name: text(r.name), experience: text(r.experience) }))
      })),
      mainTech: (about.main_tech || []).map((t) => text(t && t.name)).filter(Boolean),
      hasMainTech: (about.main_tech || []).length > 0,
      awards: (about.awards || []).map((a) => ({ date: text(a.date), name: text(a.name) })),
      hasAwards: (about.awards || []).length > 0,
      historyTitle: text(history.title) || "이력 및 활동",
      historyDescription: text(history.description), hasHistoryDescription: !!text(history.description),
      activitiesTitle: text(history.activities_title),
      activitiesDescription: text(history.activities_description), hasActivitiesDescription: !!text(history.activities_description),

        const items = (a.items || []).map(text).filter(Boolean);

      }),
      hasEducation: !!(text(edu.major) || text(edu.school) || text(edu.period)),
      eduMajor: text(edu.major), eduSchool: text(edu.school), eduPeriod: text(edu.period),
      certs: (history.certificates || []).map((c) => ({ name: text(c.name), meta: [text(c.org), text(c.date)].filter(Boolean).join(" · ") })),
      hasCerts: (history.certificates || []).length > 0,
      hasProjects: hasProjects,
      hasFilters: techs.length > 1,
      filters: [null].concat(techs).map((t) => ({
        label: t || "전체", cls: filter === t ? "on" : "", sel: filter === t ? "true" : "false", pick: () => this.setState({ filter: t })
      })),
      projects: cards.filter((c) => !filter || text(c.main_tech) === filter).map((c, i) => {
        const cover = imageAddress(c.cover_image);
        const ok = !!cover && !s.failed[cover];
        return {
          cover: cover, hasCover: ok, showAuto: !ok,
          coverFailed: () => this.setState({ failed: Object.assign({}, s.failed, { [cover]: true }) }),
          repo: repoName(c), language: text(c.language), hasLanguage: !!text(c.language),
          mainTech: text(c.main_tech), period: text(c.period), title: text(c.title), stack: text(c.stack),
          summary: (c.summary || []).map(text).filter(Boolean),

      troubles: (page.troubleshooting || []).map((t) => ({

      noTroubles: (page.troubleshooting || []).length === 0,
      contactDescription: text(contact.description), hasContactDescription: !!text(contact.description),
      links: (contact.links || []).map((l) => ({ label: text(l.label), value: text(l.value) })),
      linkButtons: (contact.links || []).filter((l) => isHttp(l.url)).map((l) => ({ label: linkName(l.label), url: text(l.url) })),
      email: email, hasEmail: !!email, noEmail: !email,
      copyLabel: s.copied ? "복사했어요" : "이메일 복사",
      copy: () => {
        const done = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1500); };
        try { navigator.clipboard.writeText(email).then(done, () => {}); } catch (e) {}
      },
      footer: text(page.footer)
    };
  }
}

window.__dcStart();
</script>
